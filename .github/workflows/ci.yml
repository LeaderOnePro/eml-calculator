name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts-tests:
    name: TS core (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm + Node.js
        uses: pnpm/setup@v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Run vitest
        run: pnpm test

  python-tests:
    name: Python core (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Run pytest
        run: uv run pytest
