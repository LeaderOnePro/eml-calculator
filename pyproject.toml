[project]
name = "eml-calculator-api"
version = "1.0.0"
description = "EML calculator backend — deterministic formula→EML compiler, complex evaluator, numeric verifier, LLM fallback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeaderOnePro" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "numpy>=2.1",
    "mpmath>=1.3",
    "openai>=1.50",
    "lark>=1.2",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["emlcore", "tests", "scripts", "api"]
extend-exclude = [".venv"]

[tool.ruff.lint]
# Ruff's default rule set plus isort, pyupgrade, flake8-simplify, and bugbear —
# a pragmatic baseline for a small, correctness-focused codebase.
extend-select = ["I", "UP", "SIM", "B"]

[tool.ruff.lint.per-file-ignores]
# The API intentionally catches broad exceptions to return structured JSON
# errors, and the verifier's sampling loop treats any reference-eval failure
# as "x outside the reference domain".
"api/*" = ["BLE001"]
"emlcore/verify.py" = ["BLE001", "S112"]

[tool.ruff.format]
quote-style = "double"
