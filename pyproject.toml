[project]
name = "eml-calculator-api"
version = "0.1.0"
description = "EML calculator backend — deterministic formula→EML compiler, complex evaluator, numeric verifier, LongCat fallback"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "numpy>=2.1",
    "mpmath>=1.3",
    "openai>=1.50",
    "lark>=1.2",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
]

# Vercel Python runtime: load the FastAPI `app` from api/index.py
[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
